<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

  <nav class="nav-bar">

    </div>

  </div>
  <div class="main">
    <div class="tranding">
      <h4>Tranding song</h4>
        <div class="card">
          <div class="container">
            <div class="info">
               <img src="/spotify_clone/assite/card1img.jpeg" alt="noimg">

            </div>
         
          </div>
